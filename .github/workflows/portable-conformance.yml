name: Portable component conformance

on:
  push:
    branches: [main]
    paths: ['Application/**', '.github/workflows/portable-conformance.yml']
  pull_request:
    paths: ['Application/**', '.github/workflows/portable-conformance.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: ${{ matrix.kind }} / ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        kind: [c, swift]
        configuration: [Debug, Release]
    steps:
      - name: Preserve source bytes on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.10.11'
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check cmake==3.31.6 ninja==1.11.1.4
      - name: Select macOS toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -d /Applications/Xcode_26.1.1.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.1.1.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Configure Windows C toolchain
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-vsdevenv@f1ba60d553a3216ce1b89abe0201213536bc7557 # v6
        with:
          arch: amd64
      - name: Install Swift 6.4.1 on Windows
        if: runner.os == 'Windows' && matrix.kind == 'swift'
        uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
          build_arch: amd64
          cache: false
          update-sdk-modules: false
      - name: Run component conformance
        run: python Application/scripts/run-portable-ci.py ${{ matrix.kind }} --configuration ${{ matrix.configuration }} --output "${{ runner.temp }}/rebase-conformance"
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-${{ matrix.kind }}-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            ${{ runner.temp }}/rebase-conformance/*.json
            ${{ runner.temp }}/rebase-conformance/*.log
            ${{ runner.temp }}/rebase-conformance/*.xml
          retention-days: 7
          if-no-files-found: warn

  windows-soxr:
    name: Public SoXR DLL / Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Preserve pinned source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.10.11'
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check cmake==3.31.6 ninja==1.11.1.4
      - uses: compnerd/gha-setup-vsdevenv@f1ba60d553a3216ce1b89abe0201213536bc7557 # v6
        with:
          arch: amd64
      - name: Build and exercise public SoXR
        run: python Application/scripts/build-windows-soxr.py --output "${{ runner.temp }}/rebase-soxr"
      - name: Upload SoXR conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-soxr-windows-x64
          path: |
            ${{ runner.temp }}/rebase-soxr/*.json
            ${{ runner.temp }}/rebase-soxr/*.log
          retention-days: 7
          if-no-files-found: warn

  windows-native-audio:
    name: Native audio foundation / Windows x64 / ${{ matrix.configuration }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.10.11'
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check cmake==3.31.6 ninja==1.11.1.4
      - uses: compnerd/gha-setup-vsdevenv@f1ba60d553a3216ce1b89abe0201213536bc7557 # v6
        with:
          arch: amd64
      - name: Build adapter and run read-only checks
        run: python Application/scripts/run-windows-native-audio-ci.py --configuration ${{ matrix.configuration }} --output "${{ runner.temp }}/rebase-native-audio"
      - name: Upload native audio foundation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-native-audio-windows-x64-${{ matrix.configuration }}
          path: |
            ${{ runner.temp }}/rebase-native-audio/*.json
            ${{ runner.temp }}/rebase-native-audio/*.log
            ${{ runner.temp }}/rebase-native-audio/*.xml
            ${{ runner.temp }}/rebase-native-audio/soxr/*.json
            ${{ runner.temp }}/rebase-native-audio/soxr/*.log
          retention-days: 7
          if-no-files-found: warn

  compare-example-render:
    name: Compare Windows and macOS example PCM
    needs: portable
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.10.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: conformance-swift-*
          path: ${{ runner.temp }}/render-inputs
      - name: Compare actual rendered sample bytes
        run: python Application/scripts/compare-portable-renders.py --input "${{ runner.temp }}/render-inputs" --output "${{ runner.temp }}/render-comparison.json"
      - name: Upload render comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-example-render-comparison
          path: ${{ runner.temp }}/render-comparison.json
          retention-days: 7
          if-no-files-found: warn

  macos-application:
    name: Existing public macOS application tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.10.11'
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check cmake==3.31.6 ninja==1.11.1.4
      - name: Select macOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test -d /Applications/Xcode_26.1.1.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.1.1.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Run existing public tests
        run: python Application/scripts/run-portable-ci.py macos-app --configuration Debug --output "${{ runner.temp }}/rebase-app-conformance"
      - name: Upload application conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-macos-application-public
          path: |
            ${{ runner.temp }}/rebase-app-conformance/*.json
            ${{ runner.temp }}/rebase-app-conformance/*.log
            ${{ runner.temp }}/rebase-app-conformance/*.xml
          retention-days: 7
          if-no-files-found: warn
