name: Windows application development build

on:
  push:
    branches: [main]
    paths: ['Application/**', '.github/workflows/windows-application.yml']
  pull_request:
    paths: ['Application/**', '.github/workflows/windows-application.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Windows x64 packaged application and window smoke
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.10.11'
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check cmake==3.31.6 ninja==1.11.1.4 pefile==2024.8.26
      - uses: compnerd/gha-setup-vsdevenv@f1ba60d553a3216ce1b89abe0201213536bc7557 # v6
        with:
          arch: amd64
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Install Swift 6.4.1
        uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
          build_arch: amd64
          cache: false
          update-sdk-modules: false
      - name: Build, assemble and verify development application
        run: python Application/scripts/build-windows-app.py --output "${{ runner.temp }}/rebase-windows-application"
      - name: Upload application verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-application-evidence
          path: |
            ${{ runner.temp }}/rebase-windows-application/evidence/*.json
            ${{ runner.temp }}/rebase-windows-application/evidence/*.log
            ${{ runner.temp }}/rebase-windows-application/evidence/*.png
            ${{ runner.temp }}/rebase-windows-application/evidence/native/*.json
            ${{ runner.temp }}/rebase-windows-application/evidence/native/*.xml
            ${{ runner.temp }}/rebase-windows-application/evidence/native/*.log
            ${{ runner.temp }}/rebase-windows-application/evidence/native/soxr/*.json
            ${{ runner.temp }}/rebase-windows-application/evidence/native/soxr/*.log
            ${{ runner.temp }}/rebase-windows-application/evidence/dependency-controls/*.json
            ${{ runner.temp }}/rebase-windows-application/evidence/dependency-controls/*.log
            ${{ runner.temp }}/rebase-windows-application/evidence/shared/*.json
            ${{ runner.temp }}/rebase-windows-application/evidence/shared/*.xml
            ${{ runner.temp }}/rebase-windows-application/evidence/shared/*.log
            ${{ runner.temp }}/rebase-windows-application/evidence/shared/source-stream-receipt-controls/observation.json
            ${{ runner.temp }}/rebase-windows-application/evidence/shared/source-stream-receipt-controls/controls.log
            ${{ runner.temp }}/rebase-windows-application/evidence/source-stream-window-controls/observation.json
            ${{ runner.temp }}/rebase-windows-application/evidence/source-stream-window-controls/controls.log
            ${{ runner.temp }}/rebase-windows-application/evidence/native-package-controls/observation.json
            ${{ runner.temp }}/rebase-windows-application/evidence/native-package-controls/controls.log
          retention-days: 7
          if-no-files-found: warn
      - name: Upload verified development build
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Rebase-Windows-x64-development-${{ github.sha }}
          path: ${{ runner.temp }}/rebase-windows-application/download/*.zip
          retention-days: 7
          if-no-files-found: error
